<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Meal Planner</title>
		<link rel="stylesheet" href="styles.css" />
		<link rel="manifest" href="manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="apple-touch-icon" href="icons/icon-192.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body class="pb-28">
		<!-- Toast Notifikacija -->
		<div
			id="toast"
			class="fixed top-6 left-1/2 -translate-x-1/2 z-[60] bg-gray-900 text-white px-6 py-3 rounded-2xl shadow-2xl text-sm font-bold opacity-0 pointer-events-none"
		>
			Kopirano u clipboard!
		</div>

		<!-- Header -->
		<header class="bg-white shadow-sm sticky top-0 z-40">
			<div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
				<h1 class="text-xl font-bold text-purple-800 tracking-tight">
					Meal Planner
				</h1>
				<div class="flex gap-2">
					<button
						onclick="changeUser('Djordje')"
						id="btnDjordje"
						class="px-3 py-1 rounded-full text-xs font-semibold border-2 transition-all"
					>
						Đorđe
					</button>
					<button
						onclick="changeUser('Miljana')"
						id="btnMiljana"
						class="px-3 py-1 rounded-full text-xs font-semibold border-2 transition-all"
					>
						Miljana
					</button>
				</div>
			</div>
			<div class="max-w-md mx-auto px-4 pb-2">
				<div class="flex bg-gray-100 rounded-lg p-1">
					<button
						onclick="changeWeek(1)"
						id="week1Btn"
						class="flex-1 py-2 text-sm font-medium rounded-md transition-all"
					>
						1. i 3. Nedelja
					</button>
					<button
						onclick="changeWeek(2)"
						id="week2Btn"
						class="flex-1 py-2 text-sm font-medium rounded-md transition-all"
					>
						2. i 4. Nedelja
					</button>
				</div>
			</div>
		</header>

		<!-- Plan View -->
		<main class="max-w-md mx-auto p-4" id="planView">
			<div
				class="flex gap-3 overflow-x-auto pb-4 mb-4 custom-scrollbar"
				id="daySelector"
			></div>
			<div id="mealsContainer" class="space-y-4"></div>
			<div
				class="mt-8 p-4 bg-purple-50 rounded-2xl border border-purple-100 text-center"
			>
				<p
					class="text-purple-600 text-[10px] font-black uppercase tracking-widest mb-1"
				>
					Dnevni unos kalorija
				</p>
				<p class="text-3xl font-black text-purple-900" id="dailyKcal">0 kcal</p>
			</div>
		</main>

		<!-- Shopping List View -->
		<main class="max-w-md mx-auto p-4 hidden" id="shoppingView">
			<div class="flex justify-between items-center mb-6">
				<h2 class="text-2xl font-bold text-gray-800">Kupovina</h2>
				<div class="flex gap-2">
					<button
						onclick="copyShoppingList()"
						title="Kopiraj listu"
						class="p-2 bg-purple-100 text-purple-800 rounded-xl active:scale-90 transition-transform"
					>
						<svg
							class="w-5 h-5"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							viewBox="0 0 24 24"
						>
							<path
								d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
							></path>
						</svg>
					</button>
					<button
						onclick="shareOnWhatsApp()"
						title="Podeli na WhatsApp"
						class="p-2 bg-green-100 text-green-700 rounded-xl active:scale-90 transition-transform"
					>
						<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
							<path
								d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.445 0 .081 5.363.079 11.969c0 2.112.551 4.173 1.595 6.02L0 24l6.146-1.612a11.827 11.827 0 005.9 1.587h.005c6.604 0 11.967-5.363 11.97-11.97a11.81 11.81 0 00-3.509-8.472z"
							/>
						</svg>
					</button>
				</div>
			</div>

			<!-- Filteri za kupovinu -->
			<div
				class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 mb-6 space-y-5"
			>
				<div>
					<p
						class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3"
					>
						Za koga kupujemo?
					</p>
					<div class="flex gap-3">
						<label
							for="shopDj"
							id="lblDj"
							class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-gray-50 rounded-2xl cursor-pointer border-2 transition-all"
						>
							<input
								type="checkbox"
								id="shopDj"
								class="hidden"
								onchange="toggleLabel(this); generateShoppingList();"
							/>
							<span class="text-sm font-bold text-gray-700">Đorđe</span>
						</label>
						<label
							for="shopMi"
							id="lblMi"
							class="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-gray-50 rounded-2xl cursor-pointer border-2 transition-all"
						>
							<input
								type="checkbox"
								id="shopMi"
								class="hidden"
								onchange="toggleLabel(this); generateShoppingList();"
							/>
							<span class="text-sm font-bold text-gray-700">Miljana</span>
						</label>
					</div>
				</div>
				<div>
					<div class="flex justify-between items-center mb-3">
						<p
							class="text-[10px] font-black text-gray-400 uppercase tracking-widest"
						>
							Za koje dane?
						</p>
						<div class="flex gap-2">
							<button
								onclick="selectAllShopDays()"
								class="text-[10px] font-bold text-purple-600 bg-purple-50 px-2 py-1 rounded-md"
							>
								Sve
							</button>
							<button
								onclick="clearShopDays()"
								class="text-[10px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded-md"
							>
								Reset
							</button>
						</div>
					</div>
					<div
						class="flex gap-2 overflow-x-auto pb-2 custom-scrollbar flex-nowrap"
						id="shopDayGrid"
					></div>
				</div>
			</div>

			<div id="shoppingListContainer" class="space-y-6 pb-10"></div>
		</main>

		<!-- Hidden Area for Clipboard -->
		<textarea
			id="hiddenClipboard"
			class="absolute -left-[9999px]"
			readonly
		></textarea>

		<!-- Bottom Navigation -->
		<nav
			class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-gray-100 px-8 py-3 flex justify-around items-center z-50 shadow-[0_-10px_20px_rgba(0,0,0,0.03)]"
		>
			<button
				onclick="showView('plan')"
				id="navPlan"
				class="flex flex-col items-center gap-1 text-purple-800 transition-all scale-110"
			>
				<svg
					class="w-6 h-6"
					fill="none"
					stroke="currentColor"
					stroke-width="2.5"
					viewBox="0 0 24 24"
				>
					<path
						d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"
					></path>
				</svg>
				<span class="text-[10px] font-black uppercase">Plan</span>
			</button>
			<button
				onclick="showView('shopping')"
				id="navShop"
				class="flex flex-col items-center gap-1 text-gray-400 transition-all"
			>
				<svg
					class="w-6 h-6"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					viewBox="0 0 24 24"
				>
					<path
						d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
					></path>
				</svg>
				<span class="text-[10px] font-black uppercase">Kupovina</span>
			</button>
		</nav>

		<!-- Modal -->
		<div
			id="recipeModal"
			class="fixed inset-0 z-50 flex items-end sm:items-center justify-center hidden opacity-0"
		>
			<div
				class="absolute inset-0 bg-black/60 backdrop-blur-sm"
				onclick="closeModal()"
			></div>
			<div
				class="relative bg-white w-full max-w-lg rounded-t-3xl shadow-2xl overflow-hidden fixed-modal-height flex flex-col sm:rounded-2xl"
			>
				<div
					class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto my-4 sm:hidden flex-shrink-0"
				></div>
				<div
					class="px-8 pt-4 pb-4 flex justify-between items-start flex-shrink-0 border-b border-gray-50"
				>
					<h2
						id="modalMealTitle"
						class="text-2xl font-bold text-gray-800 leading-tight pr-10"
					></h2>
					<button
						onclick="closeModal()"
						class="p-2 hover:bg-gray-100 rounded-full text-gray-400 absolute right-6 top-6 sm:top-8"
					>
						<svg
							class="w-6 h-6"
							fill="none"
							stroke="currentColor"
							viewBox="0 0 24 24"
						>
							<path
								stroke-linecap="round"
								stroke-linejoin="round"
								stroke-width="2"
								d="M6 18L18 6M6 6l12 12"
							></path>
						</svg>
					</button>
				</div>
				<div class="flex-1 overflow-y-auto px-8 py-6 custom-scrollbar">
					<div id="modalMainContent" class="space-y-6">
						<div class="content-fade" id="recipeSection">
							<h3
								class="text-[10px] font-black text-purple-800 uppercase tracking-widest mb-3"
							>
								Detalji / Recept (klikni na ljubičastu gramažu za zamene)
							</h3>
							<div class="p-5 bg-gray-50 rounded-2xl border border-gray-100">
								<p
									id="modalInstructions"
									class="text-gray-700 leading-relaxed text-sm"
								></p>
							</div>
						</div>
						<div id="subPanel" class="hidden">
							<div
								class="bg-blue-50 border border-blue-100 rounded-2xl p-5 shadow-inner"
							>
								<div class="flex justify-between items-center mb-3">
									<h4 class="text-sm font-bold text-blue-800" id="subTitle">
										Proračun zamene:
									</h4>
									<button
										onclick="hideSubPanel()"
										class="text-blue-400 text-xs font-bold underline"
									>
										Zatvori
									</button>
								</div>
								<div
									id="subList"
									class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-2 custom-scrollbar"
								></div>
							</div>
						</div>
					</div>
				</div>
				<div
					id="alternativesSection"
					class="hidden px-8 py-4 bg-gray-50/50 border-t border-gray-100 flex-shrink-0"
				>
					<h3
						class="text-[10px] font-black text-blue-800 uppercase tracking-widest mb-3"
					>
						Sve dostupne opcije
					</h3>
					<div
						id="alternativesList"
						class="alternative-scroll custom-scrollbar"
					></div>
				</div>
				<div class="px-8 pb-8 pt-4 bg-white flex-shrink-0">
					<button
						onclick="closeModal()"
						class="w-full bg-gray-900 text-white py-4 rounded-xl font-bold"
					>
						Nazad na plan
					</button>
				</div>
			</div>
		</div>

		<script src="recepies.js"></script>
		<script src="script.js"></script>
	</body>
</html>
